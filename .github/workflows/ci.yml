name: Verify RuleReplay
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALLOW_PAID_MODEL_REQUESTS: "false"
      ALLOW_BILLABLE_MODAL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run bandit -r backend -q
      - run: uv run pytest --cov=rulereplay --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm test --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run test:e2e --prefix frontend
      - run: python scripts/check_secrets.py
      - run: uv run python scripts/security_audit.py
