[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rulereplay"
version = "0.1.0"
description = "Policy-backed behavioral verification for financial software updates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "modal>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6,<7",
    "ruff>=0.11,<1",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/rulereplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
